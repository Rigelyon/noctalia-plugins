id = "rigelyon/ai-sidebar"
name = "AI Sidebar"
version = "1.2.0"
plugin_api = 28
author = "rigelyon"
license = "MIT"
dependencies = []
tags = ["ai", "productivity", "utility", "panel", "bar"]
icon = "sparkles"
description = "Streamlined AI chat sidebar for Noctalia with multi-provider streaming, history, and settings."

[[setting]]
key = "default_provider"
type = "select"
label_key = "settings.default-provider.label"
description_key = "settings.default-provider.description"
default = "openai"
options = [
  { value = "openai", label_key = "settings.default-provider.options.openai" },
  { value = "anthropic", label_key = "settings.default-provider.options.anthropic" },
  { value = "gemini", label_key = "settings.default-provider.options.gemini" },
  { value = "custom", label_key = "settings.default-provider.options.custom" },
]

[[setting]]
key = "openai_api_key"
type = "string"
label_key = "settings.openai-api-key.label"
description_key = "settings.openai-api-key.description"
default = ""

[[setting]]
key = "openai_model"
type = "string"
label_key = "settings.openai-model.label"
description_key = "settings.openai-model.description"
default = "gpt-4o-mini"

[[setting]]
key = "anthropic_api_key"
type = "string"
label_key = "settings.anthropic-api-key.label"
description_key = "settings.anthropic-api-key.description"
default = ""

[[setting]]
key = "anthropic_model"
type = "string"
label_key = "settings.anthropic-model.label"
description_key = "settings.anthropic-model.description"
default = "claude-3-5-haiku-20241022"

[[setting]]
key = "gemini_api_key"
type = "string"
label_key = "settings.gemini-api-key.label"
description_key = "settings.gemini-api-key.description"
default = ""

[[setting]]
key = "gemini_model"
type = "string"
label_key = "settings.gemini-model.label"
description_key = "settings.gemini-model.description"
default = "gemini-1.5-flash"

[[setting]]
key = "custom_base_url"
type = "string"
label_key = "settings.custom-base-url.label"
description_key = "settings.custom-base-url.description"
default = "http://localhost:11434/v1"

[[setting]]
key = "custom_api_key"
type = "string"
label_key = "settings.custom-api-key.label"
description_key = "settings.custom-api-key.description"
default = ""

[[setting]]
key = "custom_model"
type = "string"
label_key = "settings.custom-model.label"
description_key = "settings.custom-model.description"
default = "llama3.2"

[[setting]]
key = "system_prompt"
type = "string"
label_key = "settings.system-prompt.label"
description_key = "settings.system-prompt.description"
default = "You are a helpful and concise AI assistant."

[[setting]]
key = "enable_web_search"
type = "bool"
label_key = "settings.enable-web-search.label"
description_key = "settings.enable-web-search.description"
default = false

[[setting]]
key = "search_engine"
type = "select"
label_key = "settings.search-engine.label"
description_key = "settings.search-engine.description"
default = "duckduckgo"
options = [
  { value = "duckduckgo", label_key = "settings.search-engine.options.duckduckgo" },
  { value = "gemini_native", label_key = "settings.search-engine.options.gemini_native" },
  { value = "tavily", label_key = "settings.search-engine.options.tavily" },
  { value = "brave", label_key = "settings.search-engine.options.brave" },
]

[[setting]]
key = "search_api_key"
type = "string"
label_key = "settings.search-api-key.label"
description_key = "settings.search-api-key.description"
default = ""

[[setting]]
key = "search_max_results"
type = "select"
label_key = "settings.search-max-results.label"
description_key = "settings.search-max-results.description"
default = "3"
options = [
  { value = "3", label_key = "settings.search-max-results.options.3" },
  { value = "5", label_key = "settings.search-max-results.options.5" },
  { value = "7", label_key = "settings.search-max-results.options.7" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
placement = "floating"
position = "center_right"
width = 560
height = "fill"

[[widget]]
id = "ai-sidebar"
entry = "widget.luau"

[[widget]]
id = "bar_widget"
entry = "widget.luau"
